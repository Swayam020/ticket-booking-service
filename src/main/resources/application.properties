spring.application.name=booking

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/booking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:booking}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# HS256 needs at least 32 bytes. Unset -> a random key per start (tokens die on restart); a deploy must set it.
# Never a default here: the repo is public, so a committed secret would let anyone mint ADMIN tokens.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=15m

# both set -> that account is created as ADMIN at startup (if it doesn't exist yet)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
